name: Face verification CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FACE_NATIVE_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Verify models, API and resource admission
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock.txt
          python download_models.py
          python tests/download_fixtures.py
          python -m pytest -q
          bash -n deploy/install-face.sh
      - name: Package the verified production release
        run: |
          tar -czf face-release.tar.gz app.py requirements.lock.txt models/manifest.json models/*.onnx deploy/face-ai.service deploy/install-face.sh
          sha256sum face-release.tar.gz > face-release.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: face-release
          path: |
            face-release.tar.gz
            face-release.tar.gz.sha256
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FACE_DEPLOY_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: mar-face-media-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ARTIFACT_BUCKET: ${{ vars.FACE_ARTIFACT_BUCKET }}
      MEDIA_INSTANCE: ${{ vars.FACE_MEDIA_INSTANCE_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: face-release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.FACE_DEPLOY_ROLE_ARN }}
      - name: Deploy the same verified release on media EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $MEDIA_INSTANCE =~ ^i-[0-9a-f]+$ && $ARTIFACT_BUCKET =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          sha256sum -c face-release.tar.gz.sha256
          checksum=$(cut -d' ' -f1 face-release.tar.gz.sha256)
          key="s3://$ARTIFACT_BUCKET/ai-face/releases/$GITHUB_SHA.tar.gz"
          aws s3 cp face-release.tar.gz "$key" --only-show-errors
          url=$(aws s3 presign "$key" --expires-in 900)
          echo "::add-mask::$url"
          command=$(cat <<SCRIPT
          set -eu
          stage=\$(mktemp -d /var/tmp/mar-face-ci.XXXXXX)
          trap 'rm -rf -- "\$stage"' EXIT
          curl -fsS --proto '=https' --max-time 90 -o "\$stage/release.tgz" '$url'
          printf '%s  %s\n' '$checksum' "\$stage/release.tgz" | sha256sum -c -
          tar -xzf "\$stage/release.tgz" -C "\$stage"
          bash "\$stage/deploy/install-face.sh" '$GITHUB_SHA'
          SCRIPT
          )
          params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["900"]}')
          id=$(aws ssm send-command --instance-ids "$MEDIA_INSTANCE" --document-name AWS-RunShellScript --comment "MAR Face AI $GITHUB_SHA" --parameters "$params" --query Command.CommandId --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$MEDIA_INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Face release ready ($GITHUB_SHA)"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deploy $status ($id)" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM deploy is still pending ($id)" >&2
          exit 1
